services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reality_reconstructor}
      POSTGRES_USER: ${POSTGRES_USER:-reality_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in member_6_backend/.env or the shell}
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reality_app} -d ${POSTGRES_DB:-reality_reconstructor}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-reality_reconstructor}
      DB_USER: ${POSTGRES_USER:-reality_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in member_6_backend/.env or the shell}
      STORAGE_DIR: /app/member_6_backend/data/evidence
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      REAL_ADAPTER_FACTORY: ${REAL_ADAPTER_FACTORY:-}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend_evidence_data:/app/member_6_backend/data/evidence
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: "no"

volumes:
  backend_postgres_data:
  backend_evidence_data:
